name: Build

# Triggers: run on push or pull request targeting the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Core + Desktop + Tests: Linux self-hosted (ucs03-rtp, label devgate-rtp).
  # Moved off the ubuntu/windows/macos hosted matrix 2026-09-26 — owner call:
  # fleet runner, not GitHub-hosted, and "nothing local" is preserved because
  # the runner lives on ucs03, not on a personal box.
  build-linux:
    runs-on: [self-hosted, devgate-rtp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint exam content
        run: |
          python3 scripts/lint-content.py
          # R-07/TM-15: the lint itself must fail on a non-canonical separator
          # file (the old first-letter-only regex passed "Answer: B and D"
          # lines the parser then dropped) and pass on a canonical file.
          python3 scripts/lint-content.py --self-test

      # REQ-MAN-01/05/06: manifest shape, ID collisions, source freshness.
      # Fixture pair: failing/passing trees asserted by --self-test.
      - name: Validate content manifests
        run: |
          python3 scripts/validate-manifests.py
          python3 scripts/validate-manifests.py --self-test

      # R-13/TM-81: semantic item identity — source-aware IDs must be
      # unique across every bank (two Q1s in two files are distinct; a
      # seeded duplicate fails). Legacy EXAM:number collisions are reported
      # as informational so the migration stays visible.
      - name: Check item identity (R-13/TM-81)
        run: |
          python3 scripts/check-item-identity.py
          python3 scripts/check-item-identity.py --self-test

      # REQ-NCA-01/TM-82 (S48-01): the remap inventory is the control document
      # for the NCA cut — exactly 140 rows, every ID resolving to a parsed
      # question, no row lacking a review state, and ID stability (nothing
      # dropped, invented or renumbered). Fixture pair: run_remap_fixtures.sh
      # seeds seven defects (dropped row, blank review state, undeclared
      # objective, duplicate ID, beta product version, broken column contract)
      # plus a clean 140-row inventory that must pass.
      - name: Check NCA-75 remap inventory (REQ-NCA-01/TM-82)
        run: |
          python3 scripts/check-nca-remap.py
          python3 scripts/check-nca-remap.py --self-test
          bash tests/gates/run_remap_fixtures.sh

      # REQ-NCA-04/C-07 (S48-04): the cheatsheet is a companion surface, so a
      # claim it makes that applied errata contradicts is a defect. Fixture
      # set: run_cheatsheet_fixtures.sh seeds the stale claim and a half-fix
      # (claim deleted, correction unstated) — both must fail — plus a
      # corrected sheet that must pass. The gate also prints the sheet's link
      # inventory every run, which is the recurring form of C-07's "checked".
      - name: Check NCA-75 cheatsheet errata (REQ-NCA-04)
        run: |
          python3 scripts/check-nca-cheatsheet.py
          bash tests/gates/run_cheatsheet_fixtures.sh

      # R-12/T-25b (S47-16): the README's "What ships today" numbers must match
      # the generated manifest — exam manifests, tracks, released items (with
      # the per-exam breakdown), the badge, and the release state. Fixture set:
      # run_readme_counts_fixtures.sh seeds four disagreements (drifted total,
      # stale badge, unmentioned exam, false release state) that must each fail,
      # plus a matching README that must pass.
      - name: Check README counts against the generated manifest (R-12)
        run: |
          python3 scripts/check-readme-counts.py
          bash tests/gates/run_readme_counts_fixtures.sh

      # C-09/T-31a (S48-07): every tracked PDF carries a hash, a size and a
      # rights status, and the record cannot claim a document the tree does
      # not contain — the two vendor manuals are large-object pointer text,
      # so "in-repo" for them is a failure. Fixture set:
      # run_source_inventory_fixtures.sh seeds four lies (stale hash, unlisted
      # PDF, TBD rights, a manual claimed present) that must each fail, plus
      # a consistent row that must pass.
      - name: Check source-document inventory (C-09/T-31a)
        run: |
          python3 scripts/check-source-inventory.py
          bash tests/gates/run_source_inventory_fixtures.sh

      # REQ-AP-06/T-19: diagnosis share must stay >= 50% (fail-closed on
      # untyped items). Fixture pair: --self-test (30/30 pass, 29/31 fail
      # naming the deficit, untyped/unknown-type fail-closed).
      - name: Check item type mix (REQ-AP-06)
        run: |
          python3 scripts/check-item-types.py
          python3 scripts/check-item-types.py --self-test

      # T-11: study-content.js must match content/ (drift gate).
      - name: Check compiled study content
        run: python3 scripts/generate-study-content.py --check

      # S47-07/T-25: PKG-01..04. The bundle manifest must match the content
      # tree, and the packaging scripts must not claim more than they do.
      # Fixture chain: tests/gates/run_packaging_fixtures.sh — a stale
      # manifest, a deleted declared file, an install with a declared file
      # missing, a short Flatpak commit pin and a present-but-failing
      # appimagetool must each fail; the shipped tree, the tarball-only build
      # and a working appimagetool must pass.
      - name: Packaging gates (PKG-01..04)
        run: |
          python3 scripts/generate-bundle-manifest.py \
            --content content --out content-manifest.json --check
          python3 scripts/check-packaging-manifests.py
          python3 scripts/check-packaging-manifests.py --self-test
          bash tests/gates/run_packaging_fixtures.sh

      # S47-08/T-41: R-19. With no tags and no releases, every releases link
      # and every named bundle artifact is a promise nothing can keep. Fixture
      # chain: tests/gates/run_release_truth_fixtures.sh — the dead-download
      # fixture must fail on each seeded defect, the honest fixture must pass
      # (the gate must not punish the retraction), and the gate must lift once
      # a tag exists.
      - name: Release-link truth (R-19)
        run: bash tests/gates/run_release_truth_fixtures.sh

      # S47-08/T-41: R-05/R-19. The Legacy WinForms bridge cannot be built or
      # tested on this fleet, so its surface is gated on the source: what it
      # documents must be what it registers, what its JS calls must be
      # registered, and an unimplemented type must be answered rather than
      # dropped. Fixture chain: tests/gates/run_bridge_surface_fixtures.sh.
      - name: Legacy bridge surface (R-05)
        run: bash tests/gates/run_bridge_surface_fixtures.sh

      # S47-09/T-45: R-24. ShellCheck over the packaging scripts — the class a
      # syntax check cannot see, where a diagnostic fires and the script exits 0
      # anyway. shellcheck is not in the runner image, so it is installed into
      # the workspace-local venv the gate looks for; the gate fails closed if it
      # is missing rather than reporting a pass it did not earn. The packaging
      # behaviour fixtures (icon paths, macOS fallback) ride along in
      # run_packaging_fixtures.sh above.
      - name: ShellCheck gate (R-24)
        run: |
          python3 -m venv .shellcheck-venv
          .shellcheck-venv/bin/pip install --quiet --disable-pip-version-check \
            "shellcheck-py==0.11.0.1"
          bash tests/gates/run_shellcheck_fixtures.sh

      # R-01/CI-03 companion gate: every relative import in the PWA must
      # resolve case-sensitively (deploy-host semantics). Fixture pair:
      # tests/gates/run_import_check_fixtures.sh
      - name: Check PWA import graph
        run: |
          python3 scripts/check-imports.py
          bash tests/gates/run_import_check_fixtures.sh

      # T-11/REQ-BRAND-01: nominative-use only — endorsement phrasing fails
      # the build. Fixture pair: tests/gates/run_brand_fixtures.sh. The
      # demo-script surface (T-30) warns loudly until authored, then enforces.
      - name: Brand check (REQ-BRAND-01)
        run: |
          python3 scripts/check-brand.py
          bash tests/gates/run_brand_fixtures.sh

      # R-22/T-43: web runtime fixtures — each R-22 defect has a must-fail
      # self-test plus one passing fixture per fixed bullet (Node built-in
      # test runner, zero-dependency DOM stubs).
      - name: Run web runtime fixtures
        run: bash tests/gates/run_web_fixtures.sh

      # T-24/R-09: the runtime shuffle must not change what a choice means.
      # Fixture chain: a mutated copy that treats display position as identity
      # (the pre-T-24 bug) must fail the checker; the shipped module must pass
      # it; and the real practice view must render a shuffled order on the
      # compiled bank and still score the correct choice Correct.
      - name: Run option shuffle fixtures (R-09)
        run: bash tests/gates/run_option_shuffle_fixtures.sh

      # REQ-SC-01/T-13: scenario validator scan — constant-true validators
      # fail the build. The registry's 27 pending validators warn loudly
      # until the T-14 sweep (S46-04) lands; fixture chain proves detection.
      - name: Scenario validator scan (REQ-SC-01)
        run: bash tests/gates/run_validator_scan_fixtures.sh

      # T-46/SPEC-08A: RedEye lane — every seeded defect caught (REQ-REV-03),
      # ship-gate fail-closed with named exclusions (REQ-REV-02/05).
      - name: Run RedEye lane fixtures
        run: bash tests/gates/run_redeye_fixtures.sh

      # S48-08/TM-66: the tutor evaluation. The harness asserts both
      # directions (recorded examples resolve and cite allowlisted corpus IDs;
      # an injection-compliant response is caught, an unknown citation is
      # stripped) and ran nowhere in CI or the freeze chain before S48-08.
      - name: Run tutor evaluation (TM-66/REQ-AI-06)
        run: bash tests/gates/run_tutor_eval.sh

      # S48-08/TM-75: the traceability doc gate SPEC-12 named but nothing ran.
      # Clause A — every REQ-/R- identifier declared in SPEC-02..SPEC-10 maps
      # to a TM row. Clause B — every fixture runner under tests/gates/ is
      # either wired into the freeze chain or declared chain-excluded with a
      # reason, so no gate's failing+passing pair goes unrun.
      - name: Traceability index and runner register (TM-75)
        run: |
          python3 scripts/check-traceability.py
          bash tests/gates/run_traceability_fixtures.sh

      # Sprints 27-28/S27-08/S27-09: the vendor plugin contract — manifest
      # schema versions, exam/track ID ownership across every content root, and
      # plugin file integrity by SHA-256. The built-in content tree is validated
      # through the same path a vendor pack is, so "existing users unaffected"
      # is checked rather than asserted.
      - name: Vendor plugin manifests (S27-08/S27-09)
        run: |
          python3 scripts/check-plugin-manifests.py
          bash tests/gates/run_plugin_fixtures.sh

      # Sprints 29-30: self-host readiness. The platform is deployed by copying
      # a directory and serving it, so two things are load-bearing and neither
      # was checked anywhere before this pair: the service worker's precache
      # list must cover every file the app loads (a missing module is a feature
      # that dies on a first-load offline open), and every precached path must
      # exist (cache.addAll() is all-or-nothing, so one 404 means no offline
      # mode at all). It also holds docs/SELF-HOST.md to its own commands and
      # keeps the shell servable from a subdirectory, which is how it is hosted.
      - name: Self-host readiness (Sprints 29-30)
        run: |
          python3 scripts/check-selfhost.py
          bash tests/gates/run_selfhost_fixtures.sh

      # Sprints 41-42: the security baseline for a local client. No server sets
      # headers, so the meta CSP is the policy the browser enforces — and an
      # inline <script> or onclick= is silently dead under it. The gate also
      # holds the committed SBOM against the csproj graph, forbids any Pages
      # upload (delivery is a git checkout, not a hosted site) and requires the
      # CodeQL workflow that analyses this public repository.
      - name: Security baseline (Sprints 41-42)
        run: |
          python3 scripts/check-security-baseline.py
          bash tests/gates/run_security_baseline_fixtures.sh
      - name: Item hygiene (Sprints 43-44)
        run: |
          python3 scripts/check-item-hygiene.py
          python3 scripts/check-item-hygiene.py --self-test
          bash tests/gates/run_item_hygiene_fixtures.sh

      # No setup-dotnet here: the runner image (localhost/devgate-runner-rtp,
      # infra Containerfile convention) bakes the .NET 10 SDK — setup-dotnet
      # cannot write /usr/share/dotnet inside a rootless runner container.
      # The .sln cannot build on Linux: Legacy.WinForms is a windows-targeted
      # project (WFO analyzers, WebView2), so the Linux leg builds the three
      # Linux-legitimate projects explicitly instead.
      - name: Build Core
        run: dotnet build RadicalTrainingPlatform.Core/RadicalTrainingPlatform.Core.csproj --configuration Release

      - name: Build RadicalTrainingPlatform.Desktop (Avalonia)
        run: dotnet build RadicalTrainingPlatform.Desktop/RadicalTrainingPlatform.Desktop.csproj --configuration Release

      - name: Run tests
        run: dotnet test RadicalTrainingPlatform.Core.Tests/RadicalTrainingPlatform.Core.Tests.csproj --configuration Release --collect:"XPlat Code Coverage"

      # CI-02/ASM-11: collected coverage is now an enforced threshold (70%
      # line on Core, Plan v2 D-04). The gate ships a below-threshold fixture
      # that must fail and an above-threshold fixture that must pass.
      - name: Enforce coverage threshold (CI-02)
        run: |
          python3 scripts/check-coverage.py
          python3 scripts/check-coverage.py --self-test

      # Headless Avalonia UI smoke suite (xunit.v3/MTP — runs as the built exe,
      # not via VSTest). Boots the real App + MainWindow on the fleet runner
      # with no display: catches XAML-load breaks (e.g. Avalonia package skew)
      # and the Review-button crash path that unit tests on Core cannot see.
      # cwd = workspace root so the app's SearchPaths find the exam .md files.
      - name: Run desktop smoke tests (headless Avalonia)
        run: |
          dotnet build RadicalTrainingPlatform.Desktop.Tests/RadicalTrainingPlatform.Desktop.Tests.csproj --configuration Release
          ./RadicalTrainingPlatform.Desktop.Tests/bin/Release/net10.0/RadicalTrainingPlatform.Desktop.Tests

      - name: Check for vulnerable packages (blocking)
        run: |
          python3 .github/scripts/vuln_gate.py RadicalTrainingPlatform.Core/RadicalTrainingPlatform.Core.csproj RadicalTrainingPlatform.Core.Tests/RadicalTrainingPlatform.Core.Tests.csproj RadicalTrainingPlatform.Desktop/RadicalTrainingPlatform.Desktop.csproj
          # CI-01/TM-71: the gate itself must be able to fail — run its fixture suite
          python3 tests/gates/run_vuln_gate_fixtures.py

      - name: Verify no Windows.Forms in Core
        run: |
          echo "Checking RadicalTrainingPlatform.Core for System.Windows.Forms references..."
          if grep -ri "System.Windows.Forms" RadicalTrainingPlatform.Core/ 2>/dev/null; then
            echo "ERROR: RadicalTrainingPlatform.Core must not reference System.Windows.Forms" >&2
            exit 1
          fi
          NET10_DLL="RadicalTrainingPlatform.Core/bin/Release/net10.0/RadicalTrainingPlatform.Core.dll"
          if [ -f "$NET10_DLL" ]; then
            if strings "$NET10_DLL" | grep -qi "Windows.Forms"; then
              echo "ERROR: Compiled Core DLL contains Windows.Forms references" >&2
              exit 1
            fi
          fi
          echo "OK: No System.Windows.Forms references found in RadicalTrainingPlatform.Core"

      - name: Upload Core artifacts
        uses: actions/upload-artifact@v7
        with:
          name: radicaltrainingplatform-core-linux
          path: RadicalTrainingPlatform.Core/bin/Release/net10.0/
          if-no-files-found: warn

  # WinForms stays on a Windows machine — this leg builds the retargeted
  # net10.0-windows project (NU1201 with Core's net10.0 was the old
  # net8.0-windows TFM; retargeted 2026-09-26 so the solution restores).
  # windows-latest is kept deliberately: radicaltrainingplatform is a PUBLIC
  # repo, so hosted minutes are free here, unlike the fleet's private repos.
  # No job here deploys anywhere: the PWA is delivered as a git checkout and
  # run locally (S41-42 removed the Pages workflow).
  build-winforms:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # cp1252 consoles cannot print the lint output's emoji — force UTF-8
      # (this UnicodeEncodeError killed the 2026-09-02 Windows legs).
      - name: Lint exam content
        run: python scripts/lint-content.py
        env:
          PYTHONIOENCODING: utf-8
        shell: bash

      - name: Setup .NET (SDK 10 — Legacy.WinForms retargeted to net10.0-windows)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore solution
        run: dotnet restore RadicalTrainingPlatform.sln

      - name: Build solution
        run: dotnet build RadicalTrainingPlatform.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RadicalTrainingPlatform.Core.Tests/RadicalTrainingPlatform.Core.Tests.csproj --configuration Release --no-build

      - name: Upload WinForms artifacts
        uses: actions/upload-artifact@v7
        with:
          name: radicaltrainingplatform-winforms
          path: RadicalTrainingPlatform.Legacy.WinForms/bin/Release/net10.0-windows/
          if-no-files-found: warn
