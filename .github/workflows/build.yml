name: Build

# Triggers: run on push or pull request targeting the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Core + Desktop + Tests: Linux self-hosted (ucs03-rtp, label devgate-rtp).
  # Moved off the ubuntu/windows/macos hosted matrix 2026-09-26 — owner call:
  # fleet runner, not GitHub-hosted, and "nothing local" is preserved because
  # the runner lives on ucs03, not on a personal box.
  build-linux:
    runs-on: [self-hosted, devgate-rtp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint exam content
        run: |
          python3 scripts/lint-content.py
          # R-07/TM-15: the lint itself must fail on a non-canonical separator
          # file (the old first-letter-only regex passed "Answer: B and D"
          # lines the parser then dropped) and pass on a canonical file.
          python3 scripts/lint-content.py --self-test

      # REQ-MAN-01/05/06: manifest shape, ID collisions, source freshness.
      # Fixture pair: failing/passing trees asserted by --self-test.
      - name: Validate content manifests
        run: |
          python3 scripts/validate-manifests.py
          python3 scripts/validate-manifests.py --self-test

      # R-01/CI-03 companion gate: every relative import in the PWA must
      # resolve case-sensitively (deploy-host semantics). Fixture pair:
      # tests/gates/run_import_check_fixtures.sh
      - name: Check PWA import graph
        run: |
          python3 scripts/check-imports.py
          bash tests/gates/run_import_check_fixtures.sh

      # R-22/T-43: web runtime fixtures — each R-22 defect has a must-fail
      # self-test plus one passing fixture per fixed bullet (Node built-in
      # test runner, zero-dependency DOM stubs).
      - name: Run web runtime fixtures
        run: bash tests/gates/run_web_fixtures.sh

      # No setup-dotnet here: the runner image (localhost/devgate-runner-rtp,
      # infra Containerfile convention) bakes the .NET 10 SDK — setup-dotnet
      # cannot write /usr/share/dotnet inside a rootless runner container.
      # The .sln cannot build on Linux: Legacy.WinForms is a windows-targeted
      # project (WFO analyzers, WebView2), so the Linux leg builds the three
      # Linux-legitimate projects explicitly instead.
      - name: Build Core
        run: dotnet build RadicalTrainingPlatform.Core/RadicalTrainingPlatform.Core.csproj --configuration Release

      - name: Build RadicalTrainingPlatform.Desktop (Avalonia)
        run: dotnet build RadicalTrainingPlatform.Desktop/RadicalTrainingPlatform.Desktop.csproj --configuration Release

      - name: Run tests
        run: dotnet test RadicalTrainingPlatform.Core.Tests/RadicalTrainingPlatform.Core.Tests.csproj --configuration Release --collect:"XPlat Code Coverage"

      # Headless Avalonia UI smoke suite (xunit.v3/MTP — runs as the built exe,
      # not via VSTest). Boots the real App + MainWindow on the fleet runner
      # with no display: catches XAML-load breaks (e.g. Avalonia package skew)
      # and the Review-button crash path that unit tests on Core cannot see.
      # cwd = workspace root so the app's SearchPaths find the exam .md files.
      - name: Run desktop smoke tests (headless Avalonia)
        run: |
          dotnet build RadicalTrainingPlatform.Desktop.Tests/RadicalTrainingPlatform.Desktop.Tests.csproj --configuration Release
          ./RadicalTrainingPlatform.Desktop.Tests/bin/Release/net10.0/RadicalTrainingPlatform.Desktop.Tests

      - name: Check for vulnerable packages (blocking)
        run: |
          python3 .github/scripts/vuln_gate.py RadicalTrainingPlatform.Core/RadicalTrainingPlatform.Core.csproj RadicalTrainingPlatform.Core.Tests/RadicalTrainingPlatform.Core.Tests.csproj RadicalTrainingPlatform.Desktop/RadicalTrainingPlatform.Desktop.csproj
          # CI-01/TM-71: the gate itself must be able to fail — run its fixture suite
          python3 tests/gates/run_vuln_gate_fixtures.py

      - name: Verify no Windows.Forms in Core
        run: |
          echo "Checking RadicalTrainingPlatform.Core for System.Windows.Forms references..."
          if grep -ri "System.Windows.Forms" RadicalTrainingPlatform.Core/ 2>/dev/null; then
            echo "ERROR: RadicalTrainingPlatform.Core must not reference System.Windows.Forms" >&2
            exit 1
          fi
          NET10_DLL="RadicalTrainingPlatform.Core/bin/Release/net10.0/RadicalTrainingPlatform.Core.dll"
          if [ -f "$NET10_DLL" ]; then
            if strings "$NET10_DLL" | grep -qi "Windows.Forms"; then
              echo "ERROR: Compiled Core DLL contains Windows.Forms references" >&2
              exit 1
            fi
          fi
          echo "OK: No System.Windows.Forms references found in RadicalTrainingPlatform.Core"

      - name: Upload Core artifacts
        uses: actions/upload-artifact@v7
        with:
          name: radicaltrainingplatform-core-linux
          path: RadicalTrainingPlatform.Core/bin/Release/net10.0/
          if-no-files-found: warn

  # WinForms stays on a Windows machine — this leg builds the retargeted
  # net10.0-windows project (NU1201 with Core's net10.0 was the old
  # net8.0-windows TFM; retargeted 2026-09-26 so the solution restores).
  # windows-latest is kept deliberately: radicaltrainingplatform is a PUBLIC
  # repo, so hosted minutes are free here, unlike the fleet's private repos.
  # pwa-deploy.yml likewise stays ubuntu-latest: actions/deploy-pages is a
  # GitHub-hosted platform capability that cannot run self-hosted.
  build-winforms:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # cp1252 consoles cannot print the lint output's emoji — force UTF-8
      # (this UnicodeEncodeError killed the 2026-09-02 Windows legs).
      - name: Lint exam content
        run: python scripts/lint-content.py
        env:
          PYTHONIOENCODING: utf-8
        shell: bash

      - name: Setup .NET (SDK 10 — Legacy.WinForms retargeted to net10.0-windows)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore solution
        run: dotnet restore RadicalTrainingPlatform.sln

      - name: Build solution
        run: dotnet build RadicalTrainingPlatform.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RadicalTrainingPlatform.Core.Tests/RadicalTrainingPlatform.Core.Tests.csproj --configuration Release --no-build

      - name: Upload WinForms artifacts
        uses: actions/upload-artifact@v7
        with:
          name: radicaltrainingplatform-winforms
          path: RadicalTrainingPlatform.Legacy.WinForms/bin/Release/net10.0-windows/
          if-no-files-found: warn
